name: Render video
on:
  push:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Buat suara narasi AI
        run: |
          pip install edge-tts gTTS
          python gen_audio.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Render video horizontal
        run: npx remotion render src/index.ts Tutorial out/tutorial-horizontal.mp4
      - name: Render video vertikal
        run: npx remotion render src/index.ts TutorialVertical out/tutorial-vertical.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video-tutorial
          path: out/*.mp4
