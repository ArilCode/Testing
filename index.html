<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download File</title>
<style>
  body{font-family:Inter,system-ui;background:#f6f8ff;margin:0;min-height:100vh;display:grid;place-items:center}
  .card{width:420px;max-width:92vw;background:#fff;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 16px}
  .file{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid #e6eaf5;border-radius:12px;margin-bottom:12px}
  .file:last-child{margin-bottom:0}
  .name{font-weight:600;font-size:14px}
  .size{font-size:12px;color:#777;margin-top:2px}
  .btn{background:#6aa8e7;color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
  .btn:hover{background:#5a96d2}
  .btn:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>
<div class="card">
  <h1>Download File</h1>

  <div class="file">
    <div>
      <div class="name">main.js</div>
    </div>
    <button class="btn" onclick="downloadFile('./files/main.js','main.js',this)">Unduh</button>
  </div>

  <div class="file">
    <div>
      <div class="name">style.css</div>
    </div>
    <button class="btn" onclick="downloadFile('./files/style.css','style.css',this)">Unduh</button>
  </div>

  <div class="file">
    <div>
      <div class="name">index.html</div>
    </div>
    <button class="btn" onclick="downloadFile('./files/index.html','index.html',this)">Unduh</button>
  </div>
</div>

<script>
function downloadFile(url, filename, btn){
  const original = btn.textContent;
  btn.textContent = 'Mengunduh...';
  btn.disabled = true;

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>{
    btn.textContent = 'Selesai ✓';
    setTimeout(()=>{
      btn.textContent = original;
      btn.disabled = false;
    },1500);
  },800);
}
</script>
</body>
</html>
