<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bongkar Web</title>
<style>
:root{--bg:#030806;--card:#07130e;--ink:#b6f5c8;--mut:#5f9a74;--line:#14452c;--acc:#00ff7f;--accink:#00170a;--hl:#00ff7f;--bad:#ff4d5e;--warn:#ffd23f;
--css:#4da3ff;--js:#ffd23f;--img:#c58bff;--json:#00ff7f;--html:#ff4d5e;--page:#5f9a74;
--mono:ui-monospace,"Cascadia Code","Fira Code",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--mono);min-height:100vh;position:relative}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.18;pointer-events:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
main{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:20px 16px 56px}
.ascii{margin:6px 0 0;color:var(--acc);font-size:.62rem;line-height:1.15;text-shadow:0 0 6px var(--acc);overflow:hidden;white-space:pre}
h1{font-size:1.7rem;line-height:1.1;margin:10px 0 10px;letter-spacing:.02em;color:var(--acc);text-shadow:0 0 10px rgba(0,255,127,.7)}
h1 .cur{display:inline-block;width:.6em;height:1.05em;background:var(--acc);vertical-align:-.15em;margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{color:var(--mut);margin:0 0 16px;max-width:56ch}
.lead::before{content:"# ";color:var(--acc)}
/* saklar tipe & bahasa */
.switch{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);background:#020a06}
.seg button{background:transparent;color:var(--mut);padding:8px 12px;font-weight:700;font-size:.82rem}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accink);box-shadow:0 0 10px rgba(0,255,127,.5)}
.bar{display:flex;gap:8px;align-items:stretch}
.prompt{display:flex;flex:1;min-width:0;align-items:center;border:1px solid var(--acc);background:#020a06;box-shadow:0 0 12px rgba(0,255,127,.25),inset 0 0 8px rgba(0,255,127,.08)}
.prompt span{padding-left:10px;color:var(--acc);white-space:nowrap;font-weight:700}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 10px;border:0;background:transparent;color:var(--ink);caret-color:var(--acc);outline:0}
input::placeholder{color:#2f6a47}
.prompt:focus-within{box-shadow:0 0 18px rgba(0,255,127,.55),inset 0 0 8px rgba(0,255,127,.12)}
button{font:inherit;cursor:pointer;border:0;border-radius:0}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.go{background:var(--acc);color:var(--accink);padding:12px 16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 0 14px rgba(0,255,127,.5)}
.go:hover{filter:brightness(1.15)}
.go:disabled{opacity:.5;cursor:progress}
/* warna pesan, dipakai log (tipe 1) dan terminal (tipe 2) */
#log,#tout{font-size:.82rem;line-height:1.5}
:is(#log,#tout) .l{white-space:pre-wrap;word-break:break-word}
:is(#log,#tout) .t{color:#2f6a47}
:is(#log,#tout) .inf{color:var(--ink)}
:is(#log,#tout) .ok{color:var(--acc)}
:is(#log,#tout) .wrn{color:var(--warn)}
:is(#log,#tout) .err{color:var(--bad);font-weight:700}
:is(#log,#tout) .dim{color:var(--mut)}
#log{margin:14px 0 0;border:1px solid var(--line);background:#020a06;padding:10px 12px;height:210px;overflow:auto;box-shadow:inset 0 0 14px rgba(0,255,127,.06)}
/* terminal tipe 2 */
.term{border:1px solid var(--acc);background:#020a06;box-shadow:0 0 14px rgba(0,255,127,.2),inset 0 0 10px rgba(0,255,127,.06);height:62vh;height:62dvh;min-height:320px;display:flex;flex-direction:column;cursor:text}
#tout{flex:1;overflow:auto;padding:10px 12px 4px}
.tline{display:flex;align-items:center;gap:6px;padding:2px 12px 6px;border-top:1px dashed var(--line);margin:0}
#tprompt{color:var(--acc);font-weight:700;white-space:nowrap;font-size:.8rem}
#tin{padding:8px 0}
.pp{color:var(--acc);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:transparent;color:var(--acc);border:1px solid var(--line);padding:6px 11px;font-size:.82rem;font-weight:700}
.chip:hover{border-color:var(--acc)}
.k-dir{color:var(--acc);font-weight:700}.k-html{color:var(--html)}.k-css{color:var(--css)}.k-js{color:var(--js)}.k-img{color:var(--img)}.k-json{color:var(--json)}.k-page{color:var(--mut)}
.hit{background:var(--warn);color:#000}
/* panel hasil tipe 1 */
#out[hidden]{display:none}
.tabs{display:flex;gap:4px;margin:22px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;color:var(--mut);padding:10px 14px;font-weight:700;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab::before{content:"./";opacity:.6}
.tab[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc);text-shadow:0 0 8px rgba(0,255,127,.6)}
.panel[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);padding:14px 16px;margin:0 0 12px}
.card h2{font-size:1rem;margin:0 0 6px;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.card h2::before{content:"> ";opacity:.7}
.card p{margin:.3em 0}
.card b{color:#fff}
code{color:var(--warn)}
.mut{color:var(--mut);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stat{background:var(--card);border:1px solid var(--line);padding:10px 12px}
.stat b{display:block;font-size:1.4rem;line-height:1.1;color:var(--acc);text-shadow:0 0 8px rgba(0,255,127,.6)}
.stat span{color:var(--mut);font-size:.78rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:#020a06;border:1px solid var(--acc);color:var(--acc);padding:2px 10px;font-size:.84rem}
.folder{font-weight:700;margin:16px 0 6px;word-break:break-all;color:var(--acc)}
.folder::before{content:"$ ls ";color:var(--mut);font-weight:400}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--page);padding:9px 10px;margin:0 0 6px}
.row[data-k=html]{border-left-color:var(--html)}.row[data-k=css]{border-left-color:var(--css)}
.row[data-k=js]{border-left-color:var(--js)}.row[data-k=img]{border-left-color:var(--img)}.row[data-k=json]{border-left-color:var(--json)}
.row .nm{flex:1;min-width:0;word-break:break-all;font-size:.92rem}
.row .nm small{display:block;color:var(--mut)}
.see{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:6px 12px;font-size:.85rem;font-weight:700}
.see:hover{background:var(--acc);color:var(--accink)}
ol.steps{padding-left:1.4em;margin:0}
ol.steps li{margin:0 0 10px}
ol.steps li::marker{color:var(--acc)}
.viewhead{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.viewhead b{word-break:break-all;font-size:.92rem;color:var(--acc)}
pre{margin:0;background:#020a06;border:1px solid var(--line);padding:12px;overflow:auto;max-height:70vh;font:12.5px/1.5 var(--mono);color:#9af0b4;white-space:pre;tab-size:2}
pre.ascii{background:none;border:0;padding:0;max-height:none;overflow:hidden}
.preview{max-width:100%;max-height:50vh;border:1px solid var(--line);background:var(--card)}
.note{border-left:3px solid var(--warn);padding:6px 12px;margin:12px 0;color:var(--mut);font-size:.88rem}
.note::before{content:"[!] ";color:var(--warn)}
@media(prefers-reduced-motion:reduce){h1 .cur{animation:none}#rain{display:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main>
  <pre class="ascii" aria-hidden="true">  ___  ___  _  _  ___ _  __ _   ___
 | _ )/ _ \| \| |/ __| |/ // \ | _ \
 | _ \ (_) | .` | (_ | ' &lt;/ _ \|   /
 |___/\___/|_|\_|\___|_|\_\_/ \_\_|_\</pre>
  <h1>BONGKAR_WEB<span class="cur"></span></h1>

  <div class="switch">
    <div class="seg" role="group" aria-label="Language">
      <button data-l="id" aria-pressed="true">ID</button>
      <button data-l="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <p class="lead" data-i18n="lead"></p>

  <!-- TIPE 1: link + tombol scan -->
  <section id="v1" hidden>
    <p style="margin:0 0 12px"><button class="chip" id="back" data-i18n="backBtn"></button></p>
    <div class="bar">
      <div class="prompt"><span>root@target:~$</span>
        <input id="u" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-ph="ph" aria-label="URL">
      </div>
      <button class="go" id="go" data-i18n="scanBtn"></button>
    </div>
    <div id="log" role="log" aria-live="polite"></div>

    <div id="out" hidden>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-t="ring" data-i18n="tabRing" aria-selected="true"></button>
        <button class="tab" role="tab" data-t="file" data-i18n="tabFile" aria-selected="false"></button>
        <button class="tab" role="tab" data-t="cara" data-i18n="tabCara" aria-selected="false"></button>
        <button class="tab" role="tab" data-t="kode" data-i18n="tabKode" aria-selected="false"></button>
      </div>
      <section class="panel" id="p-ring"></section>
      <section class="panel" id="p-file" hidden></section>
      <section class="panel" id="p-cara" hidden></section>
      <section class="panel" id="p-kode" hidden></section>
    </div>
  </section>

  <!-- TIPE 2: terminal ketik sungguhan -->
  <section id="v2">
    <div class="term" id="term">
      <div id="tout" role="log" aria-live="polite"></div>
      <form class="tline" id="tform" autocomplete="off">
        <span id="tprompt">root@bongkar:~$</span>
        <input id="tin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Terminal">
      </form>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-cmd="help">help</button>
      <button class="chip" data-cmd="ls">ls</button>
      <button class="chip" data-cmd="info">info</button>
      <button class="chip" data-cmd="gui">gui</button>
      <button class="chip" data-cmd="clear">clear</button>
      <button class="chip" data-cmd="y">y</button>
      <button class="chip" data-cmd="n">n</button>
      <button class="chip" data-cmd="__tab">Tab ⇥</button>
    </div>
  </section>
</main>

<script>

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {};      // url -> {text,type,size}
let S = null;          // hasil scan terakhir (dipakai tipe 1 dan tipe 2)

function bar(done, total) {
  const w = 20, n = Math.round(w * done / Math.max(total, 1));

}
function shortUrl(u) { try { const x = new URL(u); return (x.host + x.pathname + x.search).slice(0, 70); } catch (e) { return u; } }

/* ================= MESIN SCAN (dipakai tipe 1 & 2) ================= */
async function getRemote(url) {
  try {
    const r = await fetch('/api/fetch?url=' + encodeURIComponent(url));
    return await r.json();
  } catch (e) { return { error: t('errServer') }; }
}

function collect(doc, base) {
  const map = new Map();
  const add = (src, kind) => {
    if (!src || /^(data:|javascript:|mailto:|tel:|#|blob:)/i.test(src)) return;
    try { const u = new URL(src, base); u.hash = ''; if (!map.has(u.href)) map.set(u.href, { url: u.href, kind }); } catch (e) {}
  };
  doc.querySelectorAll('link[rel~=stylesheet]').forEach(e => add(e.getAttribute('href'), 'css'));
  doc.querySelectorAll('script[src]').forEach(e => add(e.getAttribute('src'), 'js'));
  doc.querySelectorAll('img[src],source[src],link[rel~=icon],link[rel=apple-touch-icon]').forEach(e => add(e.getAttribute('src') || e.getAttribute('href'), 'img'));
  doc.querySelectorAll('link[rel=manifest]').forEach(e => add(e.getAttribute('href'), 'json'));
  const origin = new URL(base).origin;
  let pages = 0;
  doc.querySelectorAll('a[href],iframe[src]').forEach(e => {
    if (pages >= 30) return;
    try {
      const u = new URL(e.getAttribute('href') || e.getAttribute('src'), base);
      if (u.origin === origin && u.pathname !== new URL(base).pathname && /^https?:$/.test(u.protocol)) { add(u.href, 'page'); pages++; }
    } catch (e) {}
  });
  const list = [...map.values()];
  list.forEach(i => i.same = new URL(i.url).origin === origin);
  return list;
}

function analyze(doc, base, main, items) {
  const jsTexts = items.filter(i => i.kind === 'js' && store[i.url]).map(i => store[i.url].text);
  const inlineJs = [...doc.querySelectorAll('script:not([src])')].map(s => s.textContent);
  const allJs = jsTexts.concat(inlineJs).join('\n');
  const everything = main.text + '\n' + allJs + items.filter(i => i.kind === 'css' && store[i.url]).map(i => store[i.url].text).join('\n');
  const urlsAll = items.map(i => i.url).join(' ');
  const f = {
    api: /\bfetch\s*\(|XMLHttpRequest|axios/.test(allJs),
    supabase: /supabase/i.test(allJs + urlsAll),
    firebase: /firebase/i.test(allJs + urlsAll),
    store: /localStorage|sessionStorage|indexedDB/.test(allJs),
    sw: /serviceWorker/.test(allJs),
    ws: /WebSocket/.test(allJs),
    forms: doc.querySelectorAll('form').length,
    inputs: doc.querySelectorAll('input,textarea,select').length,
    manifest: !!doc.querySelector('link[rel=manifest]'),
    viewport: !!doc.querySelector('meta[name=viewport]')
  };
  const tech = [];
  if (/react/i.test(urlsAll) || /React\.createElement|__REACT/.test(allJs)) tech.push('React');
  if (/vue/i.test(urlsAll) || /__VUE__|new Vue\(/.test(allJs)) tech.push('Vue');
  if (/_next\//.test(everything)) tech.push('Next.js');
  if (/jquery/i.test(urlsAll) || /jQuery/.test(allJs)) tech.push('jQuery');
  if (/bootstrap/i.test(urlsAll + everything.slice(0, 20000))) tech.push('Bootstrap');
  if (/tailwind/i.test(urlsAll + main.text)) tech.push('Tailwind');
  if (f.supabase) tech.push('Supabase');
  if (f.firebase) tech.push('Firebase');
  if (f.manifest || f.sw) tech.push('PWA');
  if (/\.vercel\.app$/.test(new URL(base).hostname)) tech.push('Vercel');
  if (/\.github\.io$/.test(new URL(base).hostname)) tech.push('GitHub Pages');
  const apis = [...new Set((allJs.match(/https?:\/\/[^\s"'`<>)\\]+/g) || []).map(s => s.replace(/[.,;]+$/, '')))]
    .filter(s => !/w3\.org|schema\.org|reactjs\.org|github\.com\/facebook|mozilla\.org/.test(s)).slice(0, 8);

  const txt = [doc.title, (doc.querySelector('meta[name=description]') || {}).content || '',
    [...doc.querySelectorAll('h1,h2,h3')].map(h => h.textContent).join(' '),
    (doc.body ? doc.body.textContent : '').replace(/\s+/g, ' ').slice(0, 800), urlsAll].join(' ').toLowerCase();
  const purposeIdx = [];
  RULES.forEach((r, i) => { if (r[0].test(txt)) purposeIdx.push(i); });

  return {
    f, tech, apis, purposeIdx: purposeIdx.slice(0, 3),
    desc: (doc.querySelector('meta[name=description]') || {}).content || '',
    total: [main.size].concat(items.map(i => i.size)).reduce((a, b) => a + (b || 0), 0),
    nFiles: items.filter(i => i.kind !== 'page').length + 1,
    cssCount: items.filter(i => i.kind === 'css').length,
    jsCount: items.filter(i => i.kind === 'js').length,
    inlineCount: inlineJs.length,
    jsEmpty: !allJs.trim()
  };
}

/* sistem file virtual dari hasil scan */
function buildVfs(base, main, items) {
  const origin = new URL(base).origin, used = new Set(), out = [];
  [{ url: base, kind: 'html', size: main.size, main: true }].concat(items).forEach(i => {
    const u = new URL(i.url);
    let p = u.pathname; if (p.endsWith('/')) p += 'index.html';
    if (u.origin !== origin) p = '/@' + u.host + p;
    let q = p, n = 2; while (used.has(q)) q = p + '~' + n++;
    used.add(q); out.push({ ...i, path: q, name: q.split('/').pop() });
  });
  return out;
}

/* say = fungsi pencetak pesan (log tipe 1 atau tp tipe 2) */
async function scan(raw, say, quiet) {
  if (!quiet) say('$ scan ' + raw, 'ok');
  say(t('resolving')); say(t('getMain'));
  const main = await getRemote(raw);
  if (main.error) throw new Error(main.error);
  if (!main.text) throw new Error(t('notText', main.type || t('unknown')));
  if (!main.ok) say(t('warnStatus', main.status), 'wrn');
  else say('200 OK  ' + kb(main.size) + '  ' + (main.type || '').split(';')[0], 'ok');
  if (main.finalUrl !== raw) say('redirect -> ' + shortUrl(main.finalUrl), 'wrn');

  const base = main.finalUrl;
  store[base] = { text: main.text, type: main.type, size: main.size };
  say(t('parsing'));
  const doc = new DOMParser().parseFromString(main.text, 'text/html');
  const items = collect(doc, base);
  const cnt = k => items.filter(i => i.kind === k).length;
  say(t('found', cnt('css'), cnt('js'), cnt('img'), cnt('json'), cnt('page')), 'ok');
  const inl = doc.querySelectorAll('script:not([src])').length;
  if (inl) say(t('inline', inl), 'wrn');

  const all = items.filter(i => ['css', 'js', 'json'].includes(i.kind));
  const fetchable = all.slice(0, 15);
  if (all.length > 15) say(t('limit15'), 'wrn');
  let done = 0;
  for (let i = 0; i < fetchable.length; i += 5) {
    const batch = fetchable.slice(i, i + 5);
    say(t('batch', i / 5 + 1, batch.length));
    await Promise.all(batch.map(async it => {
      const r = await getRemote(it.url);
      if (r.text != null) store[it.url] = { text: r.text, type: r.type, size: r.size };
      it.size = r.size; it.ok = r.ok; it.err = r.error;
      done++;
      if (r.error) say('FAIL  ' + shortUrl(it.url) + '  (' + r.error + ')', 'err');
      else say('GET   ' + shortUrl(it.url) + '  ' + kb(r.size), 'dim');
    }));
    say(bar(done, fetchable.length), 'ok');
  }
  say(t('analyzing'));
  const A = analyze(doc, base, main, items);
  say(t('techFound', A.tech.length ? A.tech.join(', ') : t('vanilla')), 'ok');
  if (A.apis.length) say(t('apisFound', A.apis.length), 'wrn');
  S = { base, main, items, doc, A, vfs: buildVfs(base, main, items) };
  lastOpen = null;
  return S;
}

      ${A.apis.length ? `<p class="mut" style="margin-top:12px">${esc(t('apisH'))}</p><div class="tags">${A.apis.map(a => `<span class="tag" style="word-break:break-all">${esc(a)}</span>`).join('')}</div>` : ''}</div>
    <p class="note">${esc(t('noteVisible'))}</p>`;

  const groups = {};
  const everyFile = [{ url: base, kind: 'html', same: true, size: main.size, main: true }].concat(items);
  everyFile.forEach(i => {
    const u = new URL(i.url);
    let dir, name;
    if (u.origin !== origin) { dir = u.host; name = u.pathname.split('/').pop() || u.pathname; }
    else {
      const parts = u.pathname.split('/').filter(Boolean);
      name = parts.pop() || (i.main ? 'index.html' : '/');
      dir = parts.length ? '/' + parts.join('/') + '/' : t('rootDir');
    }
    (groups[dir] = groups[dir] || []).push({ ...i, name });
  });
  const order = Object.keys(groups).sort((a, b) => (a[0] === '/' ? 0 : 1) - (b[0] === '/' ? 0 : 1) || a.localeCompare(b));
  let html = `<p class="mut">${esc(t('filesLegend'))}</p>`;
  order.forEach(dir => {
    html += `<div class="folder">${esc(dir)}</div>`;
    groups[dir].forEach(i => {

      html += `<div class="row" data-k="${i.kind}"><div class="nm">${esc(i.name)}<small>${esc(t('k_' + i.kind))}${i.size != null ? ' · ' + kb(i.size) : ''}${i.err ? ' · ' + esc(t('failRead')) : ''}</small></div>
        ${canSee ? `<button class="see" data-u="${esc(i.url)}" data-k="${i.kind}">${esc(t('view'))}</button>` : ''}</div>`;
    });
  });
  $('#p-file').innerHTML = html;
  $('#p-file').querySelectorAll('.see').forEach(b => b.onclick = () => openFile(b.dataset.u, b.dataset.k));

  $('#p-cara').innerHTML = `<div class="card"><ol class="steps">${buildSteps().map(s => `<li>${s}</li>`).join('')}</ol></div>` +
    (A.nFiles <= 2 && A.jsEmpty ? `<p class="note">${esc(t('noteEmpty'))}</p>` : '');
}

function openFile(url, kind, noTab) {

    p.innerHTML = `<div class="viewhead"><b>${esc(name)}</b></div><img class="preview" src="${esc(url)}" alt="${esc(name)}">`;
  } else {
    const s = store[url];
    const shown = s.text.length > 200000 ? s.text.slice(0, 200000) + '\n\n' + t('truncated') : s.text;
    p.innerHTML = `<div class="viewhead"><b>$ cat ${esc(name)}</b><button class="see" id="cp">${esc(t('copy'))}</button></div><div class="mut" style="margin-bottom:8px">${esc(url)} · ${kb(s.size)}</div><pre></pre>`;

function tph(html, cls) {
  const d = document.createElement('div'); d.className = 'l ' + (cls || '');
  d.innerHTML = html; tout().appendChild(d); tout().scrollTop = tout().scrollHeight;
}
function promptText() {
  if (TS.pending) return '[y/N]?';
  if (!S) return 'root@bongkar:~$';
  const host = new URL(S.base).host.split('.')[0].slice(0, 14);
  let dir = '~';
  if (TS.cwd !== '/') { const seg = TS.cwd.split('/').filter(Boolean); dir = (seg.length > 1 ? '…/' : '/') + seg[seg.length - 1]; dir = dir.slice(0, 16); }
  return 'root@' + host + ':' + dir + '$';
}
const updatePrompt = () => { $('#tprompt').textContent = promptText(); };
const techo = line => tph('<span class="pp">' + esc(promptText()) + '</span> ' + esc(line));
function ask(q, yes) {
  TS.pending = { yes };
  tph('<span class="wrn">' + esc(q) + ' [y/N]</span>');
  updatePrompt();
}
const need = () => { if (!S) { tp(t('noData'), 'wrn'); return false; } return true; };

/* jalur & folder virtual */
function norm(p) {
  const parts = [];
  for (const s of p.split('/')) { if (!s || s === '.') continue; if (s === '..') { parts.pop(); continue; } parts.push(s); }
  return '/' + parts.join('/');
}
const resolve = p => { if (!p) return TS.cwd; if (p === '~' || p.startsWith('~/')) p = p.slice(1) || '/'; return norm(p.startsWith('/') ? p : TS.cwd + '/' + p); };
const isDir = path => path === '/' || S.vfs.some(e => e.path.startsWith(path + '/'));
function listDir(path) {
  const pre = path === '/' ? '/' : path + '/', m = new Map();
  S.vfs.forEach(e => {
    if (!e.path.startsWith(pre)) return;
    const rest = e.path.slice(pre.length); if (!rest) return;
    const i = rest.indexOf('/');
    if (i < 0) { if (!(m.get(rest) || {}).dir) m.set(rest, { name: rest, dir: false, e }); }
    else m.set(rest.slice(0, i), { name: rest.slice(0, i), dir: true });
  });
  return [...m.values()].sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name));
}
function findEntry(arg) {
  const p = resolve(arg);
  const e = S.vfs.find(x => x.path === p);
  if (e) return { e, path: p };
  if (isDir(p)) return { dir: true, path: p };
  if (!arg.includes('/')) { const m = S.vfs.filter(x => x.name === arg); if (m.length === 1) return { e: m[0], path: m[0].path }; }
  return null;
}
const kcls = x => x.dir ? 'k-dir' : 'k-' + x.e.kind;
const nameHtml = x => `<span class="${kcls(x)}">${esc(x.name)}${x.dir ? '/' : ''}</span>`;
function fileText(e) {
  const s = store[e.url];
  if (s) return { text: s.text };
  if (e.err) return { msg: t('catErr'), cls: 'err' };
  if (e.kind === 'img') return { msg: t('catBinary', e.url), cls: 'wrn' };
  return { msg: t('catNotFetched'), cls: 'wrn' };
}
const fileState = e => store[e.url] ? t('st_read') : e.err ? t('st_fail') : e.kind === 'img' ? t('st_bin') : t('st_nf');
const strip = h => h.replace(/<[^>]+>/g, '');

function treeLines(path, prefix, out) {
  const list = listDir(path);
  list.forEach((x, i) => {
    if (out.length >= 300) return;
    const last = i === list.length - 1;
    out.push(prefix + (last ? '└── ' : '├── ') + nameHtml(x));
    if (x.dir) treeLines((path === '/' ? '' : path) + '/' + x.name, prefix + (last ? '    ' : '│   '), out);
  });
}

const headTail = tail => async args => {
  if (!need()) return;
  let n = 10, file = null;
  for (let i = 0; i < args.length; i++) {
    if (args[i] === '-n' && args[i + 1]) n = parseInt(args[++i], 10) || 10;
    else if (/^-\d+$/.test(args[i])) n = -parseInt(args[i], 10);
    else if (/^\d+$/.test(args[i]) && file) n = parseInt(args[i], 10);
    else if (!file) file = args[i];
  }
  if (!file) return tp(t('catUsage'), 'wrn');
  const r = findEntry(file);
  if (!r) return tp(t('catNo', file), 'err');
  if (r.dir) return tp(t('catDir', file), 'err');
  const ft = fileText(r.e); if (ft.msg) return tp(ft.msg, ft.cls);
  const lines = ft.text.split('\n');
  tp((tail ? lines.slice(-n) : lines.slice(0, n)).join('\n'));
};

const CMDS = {
  help: async () => tp(t('help')),
  man: async () => tp(t('help')),
  clear: async () => { tout().innerHTML = ''; },
  echo: async (a, s) => tp(s.replace(/^\S+\s*/, '')),
  date: async () => tp(new Date().toLocaleString(lang === 'id' ? 'id-ID' : 'en-US')),
  whoami: async () => tp('root'),
  pwd: async () => tp(TS.cwd),
  history: async () => tp(TS.hist.map((h, i) => String(i + 1).padStart(4) + '  ' + h).join('\n')),
  sudo: async () => tp(t('sudo'), 'err'),
  exit: async () => { tp('logout', 'dim'); setTimeout(() => { tout().innerHTML = ''; TS.cwd = '/'; welcome(); updatePrompt(); }, 600); },
  lang: async a => {
    if (a[0] === 'id' || a[0] === 'en') { setLang(a[0]); tp(t('langSet'), 'ok'); } else tp(t('langUsage'), 'wrn');
  },
  mode: async a => {
    if (a[0] === '1') { tp(t('modeSet', '1'), 'ok'); setTimeout(() => setMode('1'), 400); }
    else if (a[0] === '2') tp(t('alreadyTerm'), 'dim');
    else tp(t('modeUsage'), 'wrn');
  },
  gui: async a => {
    const raw = a.find(x => !x.startsWith('-'));
    tp(t('modeSet', '1'), 'ok');
    setTimeout(() => { setMode('1'); if (raw) { $('#u').value = raw; run(); } }, 400);
  },
  scan: async a => {
    const yes = a.some(x => x === '-y' || x === '--yes');
    let raw = (a.find(x => !x.startsWith('-')) || '').trim();
    if (!raw) return tp(t('usageScan'), 'wrn');
    if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
    const go = async () => {
      TS.busy = true;
      try { await scan(raw, tp, true); TS.cwd = '/'; tp(t('doneTerm'), 'ok'); renderPanelsIfShown(); }
      catch (e) { tp(t('errPrefix') + e.message, 'err'); }
      TS.busy = false; updatePrompt();
    };
    if (yes) await go(); else ask(t('confirmScan', raw) + (S ? t('replaceNote') : ''), go);
  },
  ls: async a => {
    if (!need()) return;
    const long = a.some(x => /^-.*l/.test(x));
    const target = a.find(x => !x.startsWith('-'));
    const p = resolve(target);
    const fe = S.vfs.find(x => x.path === p);
    let list;
    if (fe) list = [{ name: target, dir: false, e: fe }];
    else if (isDir(p)) list = listDir(p);
    else return tp(t('lsNo', target), 'err');
    if (!list.length) return;
    if (!long) tph(list.map(nameHtml).join('  '));
    else tph(list.map(x => (x.dir ? 'drwxr-xr-x' : '-rw-r--r--') + '  ' + (x.dir ? '-' : kb(x.e.size)).padStart(8) + '  ' + nameHtml(x)).join('\n'));
  },
  cd: async a => {
    if (!need()) return;
    const p = resolve(a[0] || '/');
    if (p !== '/' && !isDir(p)) return tp(t('cdNo', a[0]), 'err');
    TS.cwd = p;
  },
  tree: async a => {
    if (!need()) return;
    const p = resolve(a[0]);
    if (!isDir(p)) return tp(t('cdNo', a[0]), 'err');
    const out = []; treeLines(p, '', out);
    tph('<span class="k-dir">' + esc(p) + '</span>\n' + out.join('\n'));
  },
  cat: async a => {
    if (!need()) return;
    if (!a[0]) return tp(t('catUsage'), 'wrn');
    const r = findEntry(a[0]);
    if (!r) return tp(t('catNo', a[0]), 'err');
    if (r.dir) return tp(t('catDir', a[0]), 'err');
    const ft = fileText(r.e); if (ft.msg) return tp(ft.msg, ft.cls);
    const lines = ft.text.split('\n');
    const show = () => { const cap = 2000; tp(lines.slice(0, cap).join('\n')); if (lines.length > cap) tp(t('catMore', lines.length - cap), 'dim'); };
    if (lines.length > 200 && !TS.catYes) ask(t('catBig', lines.length), show); else show();
  },
  head: headTail(false),
  tail: headTail(true),
  grep: async a => {
    if (!need()) return;
    let ci = false; const rest = [];
    a.forEach(x => { if (x === '-i') ci = true; else rest.push(x); });
    if (!rest[0]) return tp(t('grepUsage'), 'wrn');
    let re; try { re = new RegExp(rest[0], ci ? 'i' : ''); } catch (e) { return tp(t('grepBad'), 'err'); }
    let targets = S.vfs.filter(e => store[e.url]);
    if (rest[1]) { const r = findEntry(rest[1]); if (!r || !r.e) return tp(t('catNo', rest[1]), 'err'); targets = targets.filter(e => e === r.e); }
    const max = 60, out = []; let stop = false;
    for (const e of targets) {
      const lines = store[e.url].text.split('\n');
      for (let i = 0; i < lines.length; i++) {
        const m = re.exec(lines[i]); if (!m) continue;
        if (out.length >= max) { stop = true; break; }
        const st = Math.max(0, m.index - 50), seg = lines[i].slice(st, st + 180), ms = m.index - st;
        const ml = Math.min(m[0].length, Math.max(0, seg.length - ms));
        out.push(`<span class="k-${e.kind}">${esc(e.path)}</span><span class="dim">:${i + 1}:</span> ${st ? '…' : ''}${esc(seg.slice(0, ms))}<span class="hit">${esc(seg.slice(ms, ms + ml))}</span>${esc(seg.slice(ms + ml))}`);
      }
      if (stop) break;
    }
    if (!out.length) return tp(t('grepNone'), 'dim');
    tph(out.join('\n'));
    if (stop) tp(t('grepMax', max), 'dim');
  },
  stat: async a => {
    if (!need()) return;
    if (!a[0]) return tp(t('catUsage'), 'wrn');
    const r = findEntry(a[0]);
    if (!r) return tp(t('catNo', a[0]), 'err');
    if (r.dir) return tp(t('stFile').padEnd(8) + ': ' + r.path + '/  (dir)');
    const e = r.e;
    tp([[t('stFile'), e.path], [t('stKind'), t('k_' + e.kind)], [t('stSize'), kb(e.size)], [t('stUrl'), e.url], [t('stState'), fileState(e)]]
      .map(x => x[0].padEnd(8) + ': ' + x[1]).join('\n'));
  },
  info: async () => {
    if (!need()) return;
    const { A, doc, base } = S, pl = purposeLabels(A);
    const rows = [[t('iTitle'), doc.title || t('untitled')], [t('iUrl'), base],
      [t('iPurpose'), pl.length ? pl.join('; ') : t('purposeUnknown')],
      [t('iTech'), A.tech.length ? A.tech.join(', ') : t('vanilla')],
      [t('iFiles'), A.nFiles + '  (' + A.cssCount + ' css, ' + A.jsCount + ' js, ' + A.inlineCount + ' inline js)'],
      [t('iSize'), kb(A.total)]];
    tp(rows.map(r => r[0].padEnd(10) + ': ' + r[1]).join('\n'));
    if (A.apis.length) tp(t('iApis') + '\n' + A.apis.map(x => '  - ' + x).join('\n'), 'dim');
    tp(t('purposeNote'), 'dim');
  },
  explain: async () => {
    if (!need()) return;
    tp(buildSteps().map((s, i) => (i + 1) + '. ' + strip(s)).join('\n'));
  },
  rm: async a => {
    if (!need()) return;
    const f = a.find(x => !x.startsWith('-'));
    if (!f) return tp(t('rmUsage'), 'wrn');
    ask(t('rmConfirm', f), async () => tp(t('rmDenied', f), 'err'));
  }
};
CMDS.ll = a => CMDS.ls(['-l', ...a]);
CMDS.dir = CMDS.ls;

/* ---- alias & perintah tambahan ---- */
function welcome() {
  tp('BONGKAR_WEB terminal v1.0', 'ok'); tp(t('tWelcome'), 'dim');
  if (S) tp(t('tHaveData', new URL(S.base).host), 'wrn');
}
const _cat = CMDS.cat;
CMDS.cat = async a => {
  TS.catYes = a.some(x => x === '-y' || x === '--yes');
  return _cat(a.filter(x => x !== '-y' && x !== '--yes'));
};
const _cd = CMDS.cd;
CMDS.cd = async a => {
  if (a[0] === '-') a = [TS.old || '/'];
  const before = TS.cwd;
  await _cd(a);
  if (TS.cwd !== before) TS.old = before;
};
CMDS.cl = CMDS.cls = CMDS.reset = CMDS.clear;
CMDS.la = a => CMDS.ls(['-la', ...a]);
CMDS.less = CMDS.more = CMDS.cat;
CMDS.logout = CMDS.exit;
CMDS.ui = CMDS.startx = CMDS.gui;
CMDS.wc = async a => {
  if (!need()) return;
  const f = a.find(x => !x.startsWith('-')); if (!f) return tp('usage: wc <file>', 'wrn');
  const r = findEntry(f); if (!r) return tp(t('catNo', f), 'err');
  if (r.dir) return tp(t('catDir', f), 'err');
  const ft = fileText(r.e); if (ft.msg) return tp(ft.msg, ft.cls);
  const tx = ft.text;
  tp(' ' + tx.split('\n').length + '  ' + (tx.trim() ? tx.trim().split(/\s+/).length : 0) + '  ' + new Blob([tx]).size + ' ' + r.path);
};
CMDS.find = async a => {
  if (!need()) return;
  const q = (a.find(x => !x.startsWith('-')) || '').toLowerCase();
  const hit = S.vfs.filter(e => e.path.toLowerCase().includes(q));
  if (!hit.length) return tp(t('grepNone'), 'dim');
  tph(hit.map(e => '<span class="k-' + e.kind + '">' + esc(e.path) + '</span>').join('\n'));
};
CMDS.file = async a => {
  if (!need()) return;
  if (!a[0]) return tp('usage: file <file>', 'wrn');
  const r = findEntry(a[0]); if (!r) return tp(t('catNo', a[0]), 'err');
  if (r.dir) return tp(r.path + '/: directory');
  tp(r.path + ': ' + t('k_' + r.e.kind) + (r.e.size != null ? ', ' + kb(r.e.size) : '') + ', ' + fileState(r.e));
};
CMDS.du = async () => {
  if (!need()) return;
  const rows = S.vfs.filter(e => e.size != null).sort((a, b) => b.size - a.size);
  const tot = rows.reduce((s, e) => s + e.size, 0);
  tph(rows.map(e => kb(e.size).padStart(9) + '  <span class="k-' + e.kind + '">' + esc(e.path) + '</span>').join('\n') + '\n' + kb(tot).padStart(9) + '  total');
};
CMDS.hostname = async () => tp(S ? new URL(S.base).host : 'bongkar');
CMDS.uname = async a => tp(a.includes('-a') ? 'BongkarOS 1.0 ' + (S ? new URL(S.base).host : 'bongkar') + ' web x86_64 GNU/Browser' : 'BongkarOS');
['touch', 'mkdir', 'mv', 'cp', 'chmod', 'chown', 'ln', 'tee'].forEach(c => { CMDS[c] = async () => tp(t('roFs', c), 'err'); });
['curl', 'wget', 'open'].forEach(c => { CMDS[c] = async () => tp(t('useScan', c), 'wrn'); });

const USAGE = {
  scan: 'usage: scan [-y|--yes] <url>', gui: 'usage: gui [url]', ui: 'usage: gui [url]',
  ls: 'usage: ls [-la] [path]', ll: 'usage: ll [path]', la: 'usage: la [path]', cd: 'usage: cd [path | - | ~]',
  cat: 'usage: cat [-y] <file>', less: 'usage: cat [-y] <file>', more: 'usage: cat [-y] <file>',
  head: 'usage: head [-n N] <file> [N]', tail: 'usage: tail [-n N] <file> [N]',
  grep: 'usage: grep [-i] <pattern> [file]', find: 'usage: find [name]', wc: 'usage: wc <file>',
  file: 'usage: file <file>', stat: 'usage: stat <file>', du: 'usage: du', tree: 'usage: tree [path]',
  rm: 'usage: rm <file>', lang: 'usage: lang id|en', mode: 'usage: mode 1|2',
  clear: 'usage: clear   (aliases: cl, cls, reset)', cl: 'usage: clear', cls: 'usage: clear',
  history: 'usage: history   (!! repeats the last command)'
};

async function exec(line) {
  if (line.trim() === '!!' && !TS.pending && TS.hist.length) line = TS.hist[TS.hist.length - 1];
  techo(line);
  if (TS.pending) {
    const p = TS.pending; TS.pending = null; updatePrompt();
    if (['y', 'yes', 'ya'].includes(line.trim().toLowerCase())) await p.yes(); else tp(t('aborted'), 'dim');
    return;
  }
  const s = line.trim(); if (!s) return;
  TS.hist.push(s); TS.hi = TS.hist.length;
  const parts = s.split(/\s+/), cmd = parts[0].toLowerCase(), args = parts.slice(1);
  const fn = CMDS[cmd];
  if (fn && args.includes('--help')) { tp(USAGE[cmd] || ('usage: ' + cmd), 'dim'); return; }
  if (!fn) {
    tp(t('notFound', parts[0]), 'err');
    if (/^https?:\/\//i.test(parts[0])) tp(t('didYouMean', parts[0]), 'dim');
    return;
  }
  await fn(args, s);
}

async function submitLine(v) {
  if (TS.busy) { tp(t('busy'), 'wrn'); return; }
  try { await exec(v); } catch (e) { tp('error: ' + e.message, 'err'); }
  updatePrompt();
}
$('#tform').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#tin').value; $('#tin').value = '';
  submitLine(v);
});

const common = a => a.reduce((p, s) => { let i = 0; while (i < p.length && p[i] === s[i]) i++; return p.slice(0, i); });
function complete() {
  const inp = $('#tin'), v = inp.value, parts = v.split(/\s+/);
  let cands, head, last;
  if (parts.length <= 1) { last = parts[0]; head = ''; cands = Object.keys(CMDS).filter(c => c.startsWith(last)).sort(); }
  else {
    if (!S) return;
    last = parts[parts.length - 1]; head = v.slice(0, v.length - last.length);
    const i = last.lastIndexOf('/'), dirPart = i >= 0 ? last.slice(0, i + 1) : '', basePart = last.slice(i + 1);
    const dp = resolve(dirPart);
    if (dp !== '/' && !isDir(dp)) return;
    cands = listDir(dp).filter(x => x.name.startsWith(basePart)).map(x => dirPart + x.name + (x.dir ? '/' : ''));
  }
  if (!cands.length) return;
  if (cands.length === 1) { inp.value = head + cands[0] + (cands[0].endsWith('/') ? '' : ' '); return; }
  const cp = common(cands);
  if (cp.length > last.length) inp.value = head + cp;
  else tph('<span class="pp">' + esc(promptText()) + '</span> ' + esc(v) + '\n' + cands.map(c => esc(c)).join('  '));
}

$('#tin').addEventListener('keydown', e => {
  const tin = e.target;
  if (e.key === 'ArrowUp') { e.preventDefault(); if (TS.hi > 0) { TS.hi--; tin.value = TS.hist[TS.hi]; } }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (TS.hi < TS.hist.length - 1) { TS.hi++; tin.value = TS.hist[TS.hi]; } else { TS.hi = TS.hist.length; tin.value = ''; } }
  else if (e.key === 'Tab') { e.preventDefault(); complete(); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); tout().innerHTML = ''; }
  else if (e.ctrlKey && e.key.toLowerCase() === 'c' && tin.selectionStart === tin.selectionEnd) {
    e.preventDefault(); tph('<span class="pp">' + esc(promptText()) + '</span> ' + esc(tin.value) + '^C'); tin.value = ''; TS.pending = null; updatePrompt();
  }
});
$('#term').addEventListener('click', () => { if (!String(getSelection())) $('#tin').focus(); });
document.querySelectorAll('#chips .chip').forEach(b => {
  b.addEventListener('mousedown', e => e.preventDefault());
  b.onclick = () => {
    const c = b.dataset.cmd;
    if (c === '__tab') complete();
    else submitLine(c);
    $('#tin').focus();
  };
});

function renderPanelsIfShown() { try { renderPanels(); } catch (e) {} }

/* ================= SAKLAR TIPE & BAHASA ================= */
function setMode(m) {
  mode = m;
  $('#v1').hidden = m !== '1'; $('#v2').hidden = m !== '2';
  if (m === '1') setTimeout(() => $('#u').focus(), 0);
  if (m === '2') {
    if (!TS.welcomed) {
      TS.welcomed = true;
      tp('BONGKAR_WEB terminal v1.0', 'ok'); tp(t('tWelcome'), 'dim');
      if (S) tp(t('tHaveData', new URL(S.base).host), 'wrn');
    }
    updatePrompt(); setTimeout(() => $('#tin').focus(), 0);
  }
}
function setLang(l) {
  lang = l; try { localStorage.setItem('bw_lang', l); } catch (e) {}
  applyLang();
}
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.querySelectorAll('[data-l]').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
  if (S) renderPanels();
  if (lastOpen && S) openFile(lastOpen.url, lastOpen.kind, true);
  else $('#p-kode').innerHTML = '<p class="mut">' + esc(t('codeHint')) + '</p>';
}
$('#back').onclick = () => setMode('2');
document.addEventListener('keydown', e => { if (e.key === 'Escape' && mode === '1') setMode('2'); });
document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => setLang(b.dataset.l));

/* ================= HUJAN KODE ================= */
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#rain'), x = c.getContext('2d');
  const chars = '01アイウエオカキクケコサシスセソ{}<>/;=$#';
  let cols, drops, fs = 14;
  function size() { c.width = innerWidth; c.height = innerHeight; cols = Math.ceil(c.width / fs); drops = Array.from({ length: cols }, () => Math.random() * c.height / fs); }
  size(); addEventListener('resize', size);
  setInterval(() => {
    x.fillStyle = 'rgba(3,8,6,.12)'; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = '#00ff7f'; x.font = fs + 'px monospace';
    for (let i = 0; i < cols; i++) {
      x.fillText(chars[Math.floor(Math.random() * chars.length)], i * fs, drops[i] * fs);
      if (drops[i] * fs > c.height && Math.random() > .975) drops[i] = 0;
      drops[i]++;
    }
  }, 60);
})();

applyLang();
setMode(mode);
boot();
