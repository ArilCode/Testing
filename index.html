<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<link rel="shortcut icon" href="./favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Aril Game" />
<link rel="manifest" href="./site.webmanifest" />
<title>Ular Tangga MABAR Hotspot</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif}
body{background:#0f1020;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{margin:10px 0;font-size:22px}
.card{background:#1e203a;padding:16px;border-radius:18px;width:100%;max-width:420px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;margin:6px 0;transition:.2s}
.btn:active{transform:scale(.97)}
.btn-host{background:linear-gradient(#00e5ff,#2979ff);color:#fff}
.btn-join{background:linear-gradient(#69f0ae,#00c853);color:#000}
.btn-dice{background:#fff;color:#000;font-size:20px;padding:18px;margin-top:10px}
.btn:disabled{opacity:.4;pointer-events:none}
input{width:100%;padding:12px;border-radius:12px;border:2px solid #2a2d5a;background:#12132a;color:#fff;font-size:16px;margin:6px 0;text-align:center;letter-spacing:2px}
#board{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:12px 0;background:#151632;padding:6px;border-radius:12px}
.cell{aspect-ratio:1;background:#23254f;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;position:relative;font-weight:600}
.cell.ladder{background:#1b4d3a}.cell.snake{background:#5a1a2a}
.cell b{font-size:11px}.cell small{font-size:8px;opacity:.7}
.pion{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px;bottom:2px;left:50%;transform:translateX(-50%);z-index:2;transition:.3s}
.log{background:#12132a;padding:10px;border-radius:10px;margin:8px 0;text-align:center;font-size:14px;min-height:40px}
.players{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.p-card{background:#2a2d5a;padding:6px 10px;border-radius:10px;font-size:12px;text-align:center;min-width:70px}
.p-card.turn{outline:2px solid #ffde59;transform:scale(1.05)}
.room-code{font-size:28px;letter-spacing:4px;background:#000;padding:10px;border-radius:10px;margin:10px 0;text-align:center;font-weight:800;color:#00e5ff}
.hide{display:none!important}
</style>
</head>
<body>
<h1>🐍 ULAR TANGGA MABAR 🪜</h1>

<div id="lobby" class="card">
  <input id="playerName" placeholder="Nama Kamu" maxlength="10" value="Player">
  <button class="btn btn-host" onclick="createRoom()">📡 BUAT ROOM (Jadi Host Hotspot)</button>
  <div style="text-align:center;margin:8px;opacity:.5">- ATAU -</div>
  <input id="joinCode" placeholder="KODE ROOM">
  <button class="btn btn-join" onclick="joinRoom()">🚀 GABUNG ROOM</button>
  <p style="font-size:11px;opacity:.6;margin-top:10px;text-align:center">Tips: Host nyalakan hotspot dulu. Semua connect ke hotspot yang sama. Ga perlu internet!</p>
</div>

<div id="room" class="card hide">
  <div>Kode Room Kamu:</div>
  <div id="myCode" class="room-code">----</div>
  <div id="playerList" class="players"></div>
  <div id="roomLog" class="log">Menunggu pemain lain...</div>
  <button id="startBtn" class="btn btn-host hide" onclick="hostStartGame()">START GAME ▶️</button>
</div>

<div id="game" class="card hide" style="max-width:500px">
  <div id="gamePlayers" class="players"></div>
  <div id="gameLog" class="log">Giliran...</div>
  <div id="board"></div>
  <button id="diceBtn" class="btn btn-dice" onclick="rollDiceMabar()">🎲 LEMPAR DADU</button>
  <div id="diceResult" style="text-align:center;font-size:40px;margin:6px">⚪</div>
</div>

<script>
// === CONFIG ===
let SNAKES={97:78,95:24,92:84,62:37,48:12,35:6,16:4};
let LADDERS={3:22,8:26,21:42,28:77,52:68,72:90,80:98};
const COLORS=['#00e5ff','#ff4081','#ffde59','#69f0ae'];
let peer=null, conn=[], isHost=false, myId='', roomId='', myName='';
let players=[], turn=0, playing=false, moving=false;
let boardEl=document.getElementById('board');

// === LOBBY ===
function createRoom(){
  myName=document.getElementById('playerName').value||'Host';
  isHost=true;
  roomId=Math.random().toString(36).substring(2,6).toUpperCase();
  peer=new Peer('ular-'+roomId);
  peer.on('open', id=>{
    myId=id;
    document.getElementById('lobby').classList.add('hide');
    document.getElementById('room').classList.remove('hide');
    document.getElementById('myCode').textContent=roomId;
    document.getElementById('startBtn').classList.remove('hide');
    players=[{id:myId,name:myName,pos:0,color:COLORS[0],isHost:true}];
    renderLobby();
  });
  peer.on('connection', c=>{
    conn.push(c);
    c.on('open', ()=>{ c.send({type:'welcome', players, roomId}); });
    c.on('data', handleData);
  });
}

function joinRoom(){
  myName=document.getElementById('playerName').value||'Player';
  let code=document.getElementById('joinCode').value.toUpperCase();
  if(!code) return alert('Masukan kode room!');
  roomId=code;
  peer=new Peer();
  peer.on('open', id=>{
    myId=id;
    let c=peer.connect('ular-'+roomId);
    conn=[c];
    c.on('open', ()=>c.send({type:'join', name:myName, id:myId}));
    c.on('data', handleData);
    document.getElementById('lobby').classList.add('hide');
    document.getElementById('room').classList.remove('hide');
    document.getElementById('myCode').textContent=roomId;
  });
}

function renderLobby(){
  document.getElementById('playerList').innerHTML=players.map(p=>`<div class="p-card" style="border-top:3px solid ${p.color}">${p.name}${p.isHost?' 👑':''}<br>${p.pos}</div>`).join('');
  document.getElementById('roomLog').textContent=`${players.length}/4 Pemain - ${isHost?'Kamu Host':'Menunggu host start'}`;
  if(isHost) broadcast({type:'updatePlayers', players});
}

function handleData(data){
  if(data.type==='welcome'){ players=data.players; renderLobby(); }
  if(data.type==='join'){
    if(isHost){
      players.push({id:data.id,name:data.name,pos:0,color:COLORS[players.length%4],isHost:false});
      renderLobby();
    }
  }
  if(data.type==='updatePlayers'){ players=data.players; renderLobby(); }
  if(data.type==='startGame'){ startGameClient(data); }
  if(data.type==='roll'){ movePlayer(data.id, data.dice); }
  if(data.type==='sync'){ players=data.players; turn=data.turn; renderGame(); }
}

function broadcast(d){ conn.forEach(c=>c.open&&c.send(d)); }

// === GAME LOGIC MABAR ===
function hostStartGame(){
  if(players.length<2) return alert('Minimal 2 pemain!');
  broadcast({type:'startGame', players, turn:0});
  startGameClient({players, turn:0});
}
function startGameClient(data){
  players=data.players; turn=data.turn||0; playing=true;
  document.getElementById('room').classList.add('hide');
  document.getElementById('game').classList.remove('hide');
  createBoard(); renderGame();
}

function createBoard(){
  boardEl.innerHTML='';
  for(let row=0; row<10; row++){
    for(let col=0; col<10; col++){
      let r=row; let base=100-r*10; let n=r%2===0? base-col : base-9+col;
      let d=document.createElement('div'); d.className='cell'; d.id='c'+n;
      if(LADDERS[n]) d.classList.add('ladder');
      if(SNAKES[n]) d.classList.add('snake');
      let lbl=LADDERS[n]?`↑${LADDERS[n]}`:SNAKES[n]?`↓${SNAKES[n]}`:'';
      d.innerHTML=`<b>${n}</b><small>${lbl}</small>`; boardEl.appendChild(d);
    }
  }
}

function renderGame(){
  document.getElementById('gamePlayers').innerHTML=players.map((p,i)=>`<div class="p-card ${i===turn?'turn':''}" style="border-top:3px solid ${p.color}">${p.name}<br>${p.pos===0?'START':p.pos}${i===turn?' ⏳':''}</div>`).join('');
  document.querySelectorAll('.pion').forEach(e=>e.remove());
  players.forEach(p=>{
    if(p.pos===0) return;
    let cell=document.getElementById('c'+p.pos); if(!cell) return;
    let pion=document.createElement('div'); pion.className='pion'; pion.style.background=p.color; pion.textContent=p.name[0]; cell.appendChild(pion);
  });
  let cur=players[turn];
  let isMyTurn=cur&&cur.id===myId;
  document.getElementById('gameLog').innerHTML=isMyTurn?`Giliran Kamu <b style="color:${cur.color}">${cur.name}</b>! Lempar dadu!`:`Giliran <b style="color:${cur.color}">${cur.name}</b>`;
  document.getElementById('diceBtn').disabled=!isMyTurn||moving;
}

function rollDiceMabar(){
  if(moving) return;
  let cur=players[turn]; if(cur.id!==myId) return;
  let d=Math.floor(Math.random()*6)+1;
  document.getElementById('diceResult').textContent=['','⚀','⚁','⚂','⚃','⚄','⚅'][d];
  if(isHost){
    movePlayer(myId,d);
    broadcast({type:'roll', id:myId, dice:d});
  } else {
    conn[0].send({type:'roll', id:myId, dice:d});
    movePlayer(myId,d);
  }
}

function movePlayer(id,dice){
  moving=true;
  let p=players.find(x=>x.id===id);
  let target=p.pos===0?dice:p.pos+dice;
  if(target>100){ moving=false; document.getElementById('gameLog').textContent=`Butuh ${100-p.pos} pas!`; nextTurnMabar(); return; }
  let cur=p.pos===0?0:p.pos;
  let it=setInterval(()=>{
    if(cur<target){ cur++; p.pos=cur; renderGame(); }
    else {
      clearInterval(it);
      if(LADDERS[p.pos]){ document.getElementById('gameLog').textContent=`🪜 TANGGA ${p.name} ${p.pos}→${LADDERS[p.pos]}`; p.pos=LADDERS[p.pos]; }
      if(SNAKES[p.pos]){ document.getElementById('gameLog').textContent=`🐍 ULAR ${p.name} ${p.pos}→${SNAKES[p.pos]}`; p.pos=SNAKES[p.pos]; }
      setTimeout(()=>{ renderGame(); if(p.pos===100){ document.getElementById('gameLog').textContent=`🏆 ${p.name} MENANG!`; playing=false; } else nextTurnMabar(); moving=false; },400);
    }
  },150);
}

function nextTurnMabar(){
  turn=(turn+1)%players.length;
  if(isHost) broadcast({type:'sync', players, turn});
  renderGame();
}
</script>

<script>
// === PWA OFFLINE MABAR ===
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
