<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<link rel="shortcut icon" href="./favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Aril Game" />
<link rel="manifest" href="./site.webmanifest" />
<title>Ular Tangga MABAR Hotspot</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<h1>🐍 ULAR TANGGA MABAR 🪜</h1>

<div id="lobby" class="card">
  <input id="playerName" placeholder="Nama Kamu" maxlength="10" value="Player">
  <button class="btn btn-host" onclick="createRoom()">📡 BUAT ROOM (Jadi Host Hotspot)</button>
  <div style="text-align:center;margin:8px;opacity:.5">- ATAU -</div>
  <input id="joinCode" placeholder="KODE ROOM">
  <button class="btn btn-join" onclick="joinRoom()">🚀 GABUNG ROOM</button>
  <p style="font-size:11px;opacity:.6;margin-top:10px;text-align:center">Tips: Host nyalakan hotspot dulu. Semua connect ke hotspot yang sama. Ga perlu internet!</p>
</div>

<div id="room" class="card hide">
  <div>Kode Room Kamu:</div>
  <div id="myCode" class="room-code">----</div>
  <div id="playerList" class="players"></div>
  <div id="roomLog" class="log">Menunggu pemain lain...</div>
  <button id="startBtn" class="btn btn-host hide" onclick="hostStartGame()">START GAME ▶️</button>
</div>

<div id="game" class="card hide" style="max-width:500px">
  <div id="gamePlayers" class="players"></div>
  <div id="gameLog" class="log">Giliran...</div>
  <div id="board"></div>
  <button id="diceBtn" class="btn btn-dice" onclick="rollDiceMabar()">🎲 LEMPAR DADU</button>
  <div id="diceResult" style="text-align:center;font-size:40px;margin:6px">⚪</div>
</div>

<script src="./main.js" type="text/javascript" charset="utf-8"></script>

<script>
  // PWA - v2.0.2 Offline Ready
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('PWA v1.0.2 ready:', reg.scope))
        .catch(err => console.log('PWA fail:', err));
    });
  }
</script>
</body>
</html>
