<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guru Dashboard - Fix Potong</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');
*{box-sizing:border-box;font-family:'Fredoka',system-ui}
body{margin:0;background:#fff8ed;color:#2d1b4e;overflow-x:hidden}
.wrap{max-width:1000px;margin:auto;padding:12px 12px 100px}
.btn{padding:11px 16px;border-radius:12px;border:2.5px solid #2d1b4e;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 #2d1b4e;background:#fff;font-size:13px;
  transition: all .15s ease;
}
/* ANIMASI TOMBOL - SHADOW HILANG PAS HOVER / KLIK */
.btn:hover{
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 #2d1b4e !important;
}
.btn:active{
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 #2d1b4e !important;
}
.btn-yellow{background:#ffe26a}.btn-black{background:#2d1b4e;color:#fff}.btn-blue{background:#a0e7e5}
.card{background:#fff;border:3px solid #2d1b4e;border-radius:20px;padding:14px;box-shadow:4px 4px 0 #2d1b4e;width:100%;overflow:hidden}
.hero{display:grid;grid-template-columns:1.2fr 0.8fr;gap:14px;margin-top:14px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.card{padding:12px}}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media(min-width:400px){.stat{grid-template-columns:repeat(4,1fr)}}
.stat div{border:2.5px solid #2d1b4e;border-radius:14px;padding:10px;text-align:center}
.stat b{font-size:22px;display:block;margin-bottom:4px;line-height:1}.stat small{display:block;font-size:11px;font-weight:700}
.s1{background:#ffb3c6}.s2{background:#a0e7e5}.s3{background:#b4f8c8}.s4{background:#ffda77}
#preview{font-size:11px;line-height:1.6;word-break:break-word}
#preview div{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.filterGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fInput{width:100%;padding:12px;border-radius:12px;border:2.5px solid #2d1b4e;font-size:13px;background:#fff}
.tableWrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:3px solid #2d1b4e;border-radius:16px;background:#fff;padding:4px;margin-top:10px}
.tableWrap table{width:100%;min-width:600px;border-collapse:separate;border-spacing:0 8px}
th{font-size:11px;color:#7a6b96;text-align:left;padding:6px 10px;white-space:nowrap}
td{background:#fff;border-top:2.5px solid #2d1b4e;border-bottom:2.5px solid #2d1b4e;padding:10px;font-size:13px;white-space:nowrap}
td:first-child{border-left:2.5px solid #2d1b4e;border-radius:12px 0 0 12px;white-space:normal;max-width:140px;overflow:hidden;text-overflow:ellipsis}
td:last-child{border-right:2.5px solid #2d1b4e;border-radius:0 12px 12px 0}
.badge{padding:4px 10px;border-radius:20px;border:2px solid #2d1b4e;font-size:11px;font-weight:700;display:inline-block;white-space:nowrap}
.Hadir{background:#b4f8c8}.Izin{background:#a0e7e5}.Sakit{background:#ffb3c6}.Alfa{background:#ffda77}
#loginModal{position:fixed;inset:0;background:#0006;backdrop-filter:blur(10px);display:none;place-items:center;z-index:99;padding:20px}
#loginModal.show{display:grid}
.loginBox{width:100%;max-width:360px;background:#fff;border:3px solid #2d1b4e;border-radius:20px;padding:20px;box-shadow:6px 6px 0 #2d1b4e}
.loginBox input{width:100%;padding:12px;border-radius:12px;border:2.5px solid #2d1b4e;margin-bottom:8px}
.hidden{display:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);background:#2d1b4e;color:#fff;padding:10px 16px;border-radius:10px;transition:.4s;z-index:200}#toast.show{transform:translate(-50%,0)}

/* TAMBAHAN FIX TANGGAL KOSONG */
.dateWrap{position:relative;width:100%}
.dateWrap input{width:100%;padding:12px;border-radius:12px;border:2.5px solid #2d1b4e;font-size:13px;background:#fff}
.datePh{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:#6b5b8a;font-size:13px;background:#fff;padding:2px 6px;border-radius:6px}
.dateWrap.has-value.datePh{display:none}

.dateWrap.has-value .datePh{display:none}
#btnLogin.hidden, #btnLogout.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center">
  <div style="font-weight:700;font-size:20px"><span style="background:#2d1b4e;color:#fff;padding:6px 10px;border-radius:10px">XI F</span> Kelas Random ✨</div>
  <div>
    <button class="btn btn-black" id="btnLogin" onclick="openL()">Login</button>
    <button class="btn btn-black hidden" id="btnLogout" onclick="logout()">Logout</button>
  </div>
</div>

<div class="hero">
<div class="card" id="dashHeader" style="margin-top:0"><h2 style="margin:0">Dashboard Guru</h2><p style="font-size:12px;color:#6b5b8a;margin:6px 0 0">Pilih tanggal di kalender, data langsung filter</p></div>
<div class="card" id="liveCard">
  <b>🔥 Live Hari Ini</b>
<div class="stat"><div class="s3"><b id="cHadir">0</b><small>Hadir</small></div><div class="s2"><b id="cIzin">0</b><small>Izin</small></div><div class="s1"><b id="cSakit">0</b><small>Sakit</small></div><div class="s4"><b id="cAlfa">0</b><small>Alfa</small></div></div>
<div id="preview" style="display:none"></div>
<button class="btn btn-yellow" style="width:100%;margin-top:10px" onclick="location.href='index.html'">
  📝 Buka Absensi Siswa
</button>
</div>
</div>

<div class="card hidden" id="dashData" style="margin-top:16px">
<div style="display:flex;justify-content:center;align-items:center"><h3 style="margin:0">📋 Data Lengkap</h3></div>

<div class="filterGrid">
  <!-- INI YANG DI FIX, BIAR ADA TULISANNYA -->
  <div class="dateWrap" id="dateWrap">
    <input id="fTanggal" type="date" onchange="onDateChange()" oninput="onDateChange()">
    <span class="datePh" id="datePh">📅 Pilih Tanggal</span>
  </div>
  <input id="fNama" class="fInput" placeholder="🔍 Cari nama..." oninput="render()">
  <select id="fStatus" class="fInput" onchange="render()"><option value="">Semua Status</option><option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alfa</option></select>
  <button class="btn btn-yellow" onclick="resetFilter()">Reset</button>
</div>
<p id="infoFilter" style="font-size:11px;color:#6b5b8a;margin:8px 0"></p>
<button class="btn btn-blue" style="width:100%;margin-bottom:8px" onclick="downloadExcel()">📊 Download Excel (.xls)</button>

<div class="tableWrap">
<table><thead><tr><th>NAMA</th><th>STATUS</th><th>TANGGAL</th><th>JAM</th><th>AKSI</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<button class="btn" style="width:100%;background:#ff5a5f;color:#fff;margin-top:10px" onclick="hapusSemua()">Hapus Data Terfilter</button>
</div>
</div>

<div id="loginModal"><div class="loginBox"><h3>Login Guru</h3><input id="email" placeholder="Email" oninput="$('eLogin').style.display='none'">
<input id="pass" type="password" placeholder="Password" oninput="$('eLogin').style.display='none'"><div id="eLogin" style="font-size:12px;color:#fff;background:#ff5a5f;border:2px solid #2d1b4e;border-radius:10px;padding:8px 10px;display:none;margin-bottom:8px;font-weight:700"></div><button class="btn btn-yellow" style="width:100%" onclick="login()">Masuk</button><button class="btn" style="width:100%;margin-top:8px" onclick="closeL()">Batal</button></div></div>
<div id="toast"></div>

<script>
const SUPABASE_URL="https://yrycrxdceukuiqtyielu.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyeWNyeGRjZXVrdWlxdHlpZWx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1OTM2NDIsImV4cCI6MjEwNjE2OTY0Mn0.UheqY6RVyeNB8A7OThpEwwWYYqzUPgt7SuMRhQJy7ak";
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const toast=m=>{$("toast").textContent=m;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2500)}
const openL=()=>{$("loginModal").classList.add("show")},closeL=()=>$("loginModal").classList.remove("show");
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

let all=[];

function setAuthUI(isLogin){
  const dashData=$("dashData");
  const btnLogin=$("btnLogin");
  const btnLogout=$("btnLogout");
  if(dashData){ dashData.classList.toggle('hidden',!isLogin); dashData.style.display = isLogin? 'block' : 'none'; }
  if(btnLogin) btnLogin.classList.toggle('hidden', isLogin);
  if(btnLogout) btnLogout.classList.toggle('hidden',!isLogin);
}

async function login(){
  const emailEl=$("email"), passEl=$("pass"), errBox=$("eLogin");
  const e=emailEl.value.trim(), p=passEl.value.trim();

  const showWarn = (msg)=>{
    errBox.textContent=msg;
    errBox.style.display="block";
    clearTimeout(window._warnTimer);
    window._warnTimer=setTimeout(()=>{ errBox.style.display="none"; }, 3000);
  };

  if(!e &&!p){ showWarn("⚠️ Email dan password tidak boleh kosong!"); return; }
  if(!e){ showWarn("⚠️ Email tidak boleh kosong!"); emailEl.focus(); return; }
  if(!p){ showWarn("⚠️ Password tidak boleh kosong!"); passEl.focus(); return; }

  errBox.textContent="⏳ Memeriksa..."; errBox.style.display="block";
  const {error}=await supa.auth.signInWithPassword({email:e,password:p});
  if(error){ showWarn("❌ Email atau password salah!"); return; }

  errBox.style.display="none"; closeL();
  emailEl.value=""; passEl.value="";
  setAuthUI(true); load();
}

async function logout(){
  await supa.auth.signOut();
  setAuthUI(false);
  all=[]; prev(false);
}

async function load(){
  const {data}=await supa.from("absensi").select("*").order("created_at",{ascending:false});
  all=data||[];
  render(); prev(true);
}

function prev(isLogin=false){
  if(!isLogin){
    $("cHadir").textContent="0"; $("cIzin").textContent="0"; $("cSakit").textContent="0"; $("cAlfa").textContent="0";
    $("preview").innerHTML="<span style='color:#6b5b8a'>Login untuk lihat data live</span>"; return;
  }
  $("cHadir").textContent=all.filter(d=>d.status==="Hadir").length;
  $("cIzin").textContent=all.filter(d=>d.status==="Izin").length;
  $("cSakit").textContent=all.filter(d=>d.status==="Sakit").length;
  $("cAlfa").textContent=all.filter(d=>d.status==="Alfa").length;
  $("preview").innerHTML="";
}

function getFiltered(){
 let d=[...all];
 if($("fNama").value) d=d.filter(x=>x.nama.toLowerCase().includes($("fNama").value.toLowerCase()));
 if($("fStatus").value) d=d.filter(x=>x.status===$("fStatus").value);
 if($("fTanggal").value){
   const picked=$("fTanggal").value;
   d=d.filter(x=>{
     const dbDate=new Date(x.created_at);
     const iso=dbDate.toISOString().slice(0,10);
     const local=dbDate.getFullYear()+"-"+String(dbDate.getMonth()+1).padStart(2,'0')+"-"+String(dbDate.getDate()).padStart(2,'0');
     return iso===picked || local===picked;
   });
 }
 return d;
}

function onDateChange(){
 const el=$("fTanggal"), wrap=$("dateWrap");
 if(el.value) wrap.classList.add("has-value"); else wrap.classList.remove("has-value");
 render();
}

function render(){
 const d=getFiltered();
 const tglText=$("fTanggal").value? new Date($("fTanggal").value).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) : "Semua Tanggal";
 $("infoFilter").textContent=`Menampilkan ${d.length} dari ${all.length} | ${tglText}`;
 $("tbody").innerHTML=d.map(x=>`<tr><td><b>${escapeHtml(x.nama)}</b></td><td><span class="badge ${escapeHtml(x.status)}">${escapeHtml(x.status)}</span></td><td>${escapeHtml(x.tanggal)}</td><td>${escapeHtml(x.jam)}</td><td><button onclick="hapusSatu('${x.id}')" style="border:2px solid #2d1b4e;border-radius:8px;background:#fff;padding:6px">🗑️</button></td></tr>`).join("")||`<tr><td colspan=5 style="text-align:center;border:0;color:#6b5b8a">Tidak ada data di tanggal ini</td></tr>`;
}

function resetFilter(){$("fTanggal").value="";$("dateWrap").classList.remove("has-value");$("fNama").value="";$("fStatus").value="";render()}
async function hapusSatu(id){if(!confirm("Hapus?"))return;await supa.from("absensi").delete().eq("id",id);toast("Terhapus");load()}
async function hapusSemua(){if(!confirm("Hapus terfilter?"))return;const d=getFiltered();for(let x of d)await supa.from("absensi").delete().eq("id",x.id);toast("Terhapus");load()}
function downloadExcel(){const d=getFiltered();if(!d.length){toast("Tidak ada data");return}let html=`<table><tr><th>NAMA</th><th>STATUS</th><th>TANGGAL</th><th>JAM</th></tr>${d.map(r=>`<tr><td>${escapeHtml(r.nama)}</td><td>${escapeHtml(r.status)}</td><td>${escapeHtml(r.tanggal)}</td><td>${escapeHtml(r.jam)}</td></tr>`).join("")}</table>`;const blob=new Blob([html],{type:"application/vnd.ms-excel"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`absensi-${$("fTanggal").value||new Date().toISOString().slice(0,10)}.xls`;a.click();toast("Excel didownload");}

(async () => {
  const { data } = await supa.auth.getSession();
  if (data.session) { setAuthUI(true); load(); }
  else { setAuthUI(false); all=[]; prev(false); }
})();
</script>
</body>
</html>
